; deploy/opcache-php.ini — tempel ke php.ini produksi (Laragon: C:\laragon\bin\php\php-8.3.30-Win32-vs16-x64\php.ini)
; Kecepatan PHP naik drastis (bytecode cache). Verifikasi: php --ri opcache
; Harus dicabut komentar baris: ;zend_extension=opcache

zend_extension=opcache

[opcache]
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5
opcache.use_cwd=1
; PRODUKSI: matikan timestamp check → restart PHP wajib setelah setiap deploy.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.revalidate_path=0
opcache.save_comments=1

; ==== VERSI DEVELOPMENT (guna validate_timestamps aktif bila perlu edit panas) ====
; opcache.validate_timestamps=1
; opcache.revalidate_freq=2