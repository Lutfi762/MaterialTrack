# deploy/nginx-materialtrack.conf — server block produksi (referensi)
# Sesuaikan server_name, root, SSL path, dan fastcgi_pass sebelum dipakai.

# HTTP → HTTPS
server {
    listen 80;
    server_name materialtrack.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name materialtrack.example.com;

    root /path/to/MaterialTrack/public;
    index index.php;

    # ---- Keamanan (header sudah diset middleware PHP juga; ini lapisan ganda) ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    ssl_certificate     /path/to/cert.pem;
    ssl_certificate_key /path/to/cert.key;

    # ---- Kompresi ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2 application/xml;

    # ---- Cache aset build (hash immutable) ----
    location ~* ^/build/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|gif|svg|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Blokir file & direktori sensitif ----
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(\.env|storage|vendor|node_modules|database|deploy|_sweep\.php) { deny all; }
    location ~ \.(env|log|sql|bak)$ { deny all; }

    # ---- Front controller ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;   # sesuaikan socket/port PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
}